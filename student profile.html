<!DOCTYPE html>
<html lang="en">
    <head> 
        <meta charset="utf-8">
        <title>Student Registration Form</title>
    </head>
    <body>
        <h2>Student Registration Form</h2>
        <form action="" method="post">  

            <label for="name">Name: </label>
            <input type="text" id="name" name="name" placeholder="e.g. Karthi" required>
    <br><br>

             <label for="regno">Register Number: </label>
             <input type="number" id="regno" name="regno" placeholder="012345678" required>
    <br><br>

             <label for="gender">Gender: </label>
             <input type="text" id="gender" name="gender" placeholder="Male / Female" required>
    <br><br>

             <label for="fathername">Father Name: </label>
             <input type="text" id="fathername" name="fathername" placeholder="Father Name" required>
    <br><br>

             <label for="dob">Date of Birth: </label>
             <input type="date" id="dob" name="dob" required>
    <br><br>

            <label for="email">Email: </label>
            <input type="email" id="email" name="email" placeholder="kk@gmail.com" required>
    <br><br>

            <label>Course: </label>
            <input type="radio" id="cse" name="course" value="CSE" required>
            <label for="cse">CSE</label>

            <input type="radio" id="ece" name="course" value="ECE">
            <label for="ece">ECE</label>

            <input type="radio" id="eee" name="course" value="EEE">
            <label for="eee">EEE</label>

            <input type="radio" id="it" name="course" value="IT">
            <label for="it">IT</label>

            <input type="radio" id="others" name="course" value="Others">
            <label for="others">Others</label>
    <br><br>

             <label for="religion">Religion: </label>
             <input type="text" id="religion" name="religion" placeholder="Enter Religion" required>
    <br><br>

             <label for="address">Address: </label>
             <input type="text" id="address" name="address" placeholder="Enter Address" required>
    <br><br>

             <label for="city">City: </label>
             <input type="text" id="city" name="city" placeholder="Enter City" required>
    <br><br>

             <label for="phone">Phone Number: </label>
             <input type="tel" id="phone" name="phone" placeholder="Enter Phone Number" minlength="10" maxlength="20" required>
    <br><br>

             <label for="photo">Student Photo: </label>
             <input type="file" id="photo" name="photo" required>
    <br><br>

             <label for="blood">Blood Group: </label>
             <select id="blood" name="blood" required>
                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>
    <br><br>

             <button type="submit">Submit</button>
             <button type="reset">Reset</button>
    </form>
    </body>
</html>
